name: CarbonLens AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Manual trigger
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '18'

jobs:
  # Code quality and security checks
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd backend && npm ci

    - name: Run ESLint
      run: |
        npx eslint src/ --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true
        npx eslint backend/src/ --ext .js,.jsx,.ts,.tsx --format json --output-file backend-eslint-report.json || true
      continue-on-error: true

    - name: Run security audit
      run: |
        npm audit --audit-level moderate --json > npm-audit.json || true
        cd backend && npm audit --audit-level moderate --json > ../backend-npm-audit.json || true
      continue-on-error: true

    - name: Upload code quality artifacts
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-reports
        path: |
          eslint-report.json
          backend-eslint-report.json
          npm-audit.json
          backend-npm-audit.json
        retention-days: 30

  # Frontend tests
  test-frontend:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run frontend tests
      run: npm run test:ci

    - name: Upload frontend coverage
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: coverage/
        retention-days: 30

  # Backend tests
  test-backend:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Run backend tests
      run: cd backend && npm run test:ci

    - name: Upload backend coverage
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: backend/coverage/
        retention-days: 30

  # Build frontend
  build-frontend:
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build
      env:
        CI: false  # Treat warnings as warnings, not errors

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: build/
        retention-days: 30

  # Deploy to development
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, build-frontend]
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    environment: development
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: build/

    - name: Install dependencies
      run: |
        npm ci
        cd backend && npm ci

    - name: Deploy infrastructure
      run: |
        aws cloudformation deploy \
          --template-file infrastructure/cloudformation-simple.yml \
          --stack-name carbonlens-ai-dev \
          --parameter-overrides \
            Environment=dev \
            ProjectName=carbonlens-ai \
            DomainName=${{ secrets.DEV_DOMAIN_NAME || 'dev.carbonlens-ai.solutionsynth.cloud' }} \
            CertificateArn=${{ secrets.DEV_CERTIFICATE_ARN }} \
          --capabilities CAPABILITY_IAM \
          --region ${{ env.AWS_REGION }}

    - name: Deploy backend
      run: |
        cd backend
        npx serverless deploy --stage dev --region ${{ env.AWS_REGION }}

    - name: Deploy frontend
      run: |
        aws s3 sync build/ s3://carbonlens-ai-web-dev-${{ secrets.AWS_ACCOUNT_ID }} --delete --cache-control "max-age=86400"
        aws cloudfront create-invalidation --distribution-id ${{ secrets.DEV_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

    - name: Run smoke tests
      run: |
        # Wait for deployment to be ready
        sleep 30
        # Add your smoke tests here
        curl -f ${{ secrets.DEV_DOMAIN_NAME || 'https://dev.carbonlens-ai.solutionsynth.cloud' }} || exit 1

  # Deploy to staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, build-frontend]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment: staging
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: build/

    - name: Install dependencies
      run: |
        npm ci
        cd backend && npm ci

    - name: Deploy infrastructure
      run: |
        aws cloudformation deploy \
          --template-file infrastructure/cloudformation-simple.yml \
          --stack-name carbonlens-ai-staging \
          --parameter-overrides \
            Environment=staging \
            ProjectName=carbonlens-ai \
            DomainName=${{ secrets.STAGING_DOMAIN_NAME || 'staging.carbonlens-ai.solutionsynth.cloud' }} \
            CertificateArn=${{ secrets.STAGING_CERTIFICATE_ARN }} \
          --capabilities CAPABILITY_IAM \
          --region ${{ env.AWS_REGION }}

    - name: Deploy backend
      run: |
        cd backend
        npx serverless deploy --stage staging --region ${{ env.AWS_REGION }}

    - name: Deploy frontend
      run: |
        aws s3 sync build/ s3://carbonlens-ai-web-staging-${{ secrets.AWS_ACCOUNT_ID }} --delete --cache-control "max-age=86400"
        aws cloudfront create-invalidation --distribution-id ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

    - name: Run integration tests
      run: |
        # Wait for deployment to be ready
        sleep 30
        # Add your integration tests here
        curl -f ${{ secrets.STAGING_DOMAIN_NAME || 'https://staging.carbonlens-ai.solutionsynth.cloud' }} || exit 1

  # Deploy to production
  deploy-prod:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: build/

    - name: Install dependencies
      run: |
        npm ci
        cd backend && npm ci

    - name: Deploy infrastructure
      run: |
        aws cloudformation deploy \
          --template-file infrastructure/cloudformation-simple.yml \
          --stack-name carbonlens-ai-production \
          --parameter-overrides \
            Environment=prod \
            ProjectName=carbonlens-ai \
            DomainName=${{ secrets.PROD_DOMAIN_NAME || 'carbonlens-ai.solutionsynth.cloud' }} \
            CertificateArn=${{ secrets.PROD_CERTIFICATE_ARN }} \
          --capabilities CAPABILITY_IAM \
          --region ${{ env.AWS_REGION }}

    - name: Deploy backend
      run: |
        cd backend
        npx serverless deploy --stage prod --region ${{ env.AWS_REGION }}

    - name: Deploy frontend
      run: |
        aws s3 sync build/ s3://carbonlens-ai-web-prod-${{ secrets.AWS_ACCOUNT_ID }} --delete --cache-control "max-age=31536000"
        aws cloudfront create-invalidation --distribution-id ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

    - name: Run production smoke tests
      run: |
        # Wait for deployment to be ready
        sleep 30
        # Add your production smoke tests here
        curl -f ${{ secrets.PROD_DOMAIN_NAME || 'https://carbonlens-ai.solutionsynth.cloud' }} || exit 1

    - name: Create GitHub release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          Automated production deployment
          
          **Deployed to:** ${{ secrets.PROD_DOMAIN_NAME || 'https://carbonlens-ai.solutionsynth.cloud' }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref }}
        draft: false
        prerelease: false

  # Cleanup old artifacts
  cleanup:
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-prod]
    if: always()
    steps:
    - name: Delete old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          
          // Keep artifacts for 7 days, then delete
          const sevenDaysAgo = new Date();
          sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
          
          for (const artifact of artifacts.data.artifacts) {
            const createdAt = new Date(artifact.created_at);
            if (createdAt < sevenDaysAgo) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
          }
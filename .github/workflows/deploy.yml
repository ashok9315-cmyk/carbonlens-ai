name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'

jobs:
  # Frontend Testing
  test-frontend:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Run ESLint
      run: npx eslint src/ --ext .js,.jsx,.ts,.tsx --max-warnings 0
      continue-on-error: true

    - name: Run frontend tests
      run: npm run test:ci || npm test -- --coverage --watchAll=false
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-results
        path: coverage/
        retention-days: 30
      if: always()

  # Backend Testing
  test-backend:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install backend dependencies
      run: cd backend && npm install --legacy-peer-deps

    - name: Run backend tests
      run: cd backend && npm run test:ci || npm test -- --coverage --watchAll=false
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: backend/coverage/
        retention-days: 30
      if: always()

  # Build Frontend
  build-frontend:
    runs-on: ubuntu-latest
    needs: [test-frontend]
    if: always() && (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped' || needs.test-frontend.result == 'failure')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build frontend
      run: |
        # Install dependencies
        npm install --legacy-peer-deps
        
        # Set environment for build based on branch
        if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
          echo "Building for development environment"
          export REACT_APP_ENVIRONMENT=dev
        elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "Building for staging environment"  
          export REACT_APP_ENVIRONMENT=staging
        else
          echo "Building for production environment"
          export REACT_APP_ENVIRONMENT=prod
        fi
        
        # Build the application
        npm run build
      env:
        CI: false

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: build/
        retention-days: 30

  # Deploy to Development
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, build-frontend]
    if: |
      always() && 
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    environment: development
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: build/

    - name: Check for existing certificate (dev)
      id: check-cert-dev
      run: |
        if [ -n "${{ secrets.DEV_DOMAIN_NAME }}" ]; then
          EXISTING_CERT=$(aws acm list-certificates \
            --query "CertificateSummaryList[?DomainName=='${{ secrets.DEV_DOMAIN_NAME }}'].CertificateArn" \
            --output text --region us-east-1)
          
          if [ -n "$EXISTING_CERT" ] && [ "$EXISTING_CERT" != "None" ]; then
            echo "certificate_arn=$EXISTING_CERT" >> $GITHUB_OUTPUT
            echo "✅ Found existing certificate: $EXISTING_CERT"
          else
            echo "❌ No existing certificate found"
            
            # Auto-create certificate if hosted zone is provided
            if [ -n "${{ secrets.HOSTED_ZONE_ID }}" ]; then
              echo "🔐 Creating SSL certificate automatically..."
              chmod +x scripts/setup-certificate.sh
              
              # Run certificate setup script
              CERT_OUTPUT=$(./scripts/setup-certificate.sh -d "${{ secrets.DEV_DOMAIN_NAME }}" -z "${{ secrets.HOSTED_ZONE_ID }}")
              
              # Extract certificate ARN from output
              NEW_CERT_ARN=$(echo "$CERT_OUTPUT" | grep "CERTIFICATE_ARN=" | cut -d'=' -f2)
              
              if [ -n "$NEW_CERT_ARN" ]; then
                echo "certificate_arn=$NEW_CERT_ARN" >> $GITHUB_OUTPUT
                echo "✅ Certificate created successfully: $NEW_CERT_ARN"
              else
                echo "❌ Failed to create certificate"
              fi
            fi
          fi
        fi

    - name: Deploy with bash script
      shell: bash
      run: |
        chmod +x scripts/deploy.sh
        
        CERTIFICATE_ARN="${{ steps.check-cert-dev.outputs.certificate_arn }}"
        
        if [ -n "${{ secrets.DEV_DOMAIN_NAME }}" ] && [ -n "$CERTIFICATE_ARN" ]; then
          echo "🚀 Deploying with existing certificate"
          ./scripts/deploy.sh -e dev -d "${{ secrets.DEV_DOMAIN_NAME }}" -c "$CERTIFICATE_ARN" -z "${{ secrets.HOSTED_ZONE_ID }}" --skip-backend
        elif [ -n "${{ secrets.DEV_DOMAIN_NAME }}" ]; then
          echo "🚀 Deploying with CDK auto-certificate creation"
          ./scripts/deploy.sh -e dev -d "${{ secrets.DEV_DOMAIN_NAME }}" -z "${{ secrets.HOSTED_ZONE_ID }}" --skip-backend
        else
          echo "🚀 Deploying without custom domain"
          ./scripts/deploy.sh -e dev --skip-backend
        fi
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    - name: Run smoke tests
      run: |
        sleep 30
        if [ -n "${{ secrets.DEV_DOMAIN_NAME }}" ]; then
          curl -f "https://${{ secrets.DEV_DOMAIN_NAME }}" || echo "Smoke test failed but continuing"
        else
          echo "No domain configured for smoke tests"
        fi
      continue-on-error: true

    - name: Test Lambda functions health
      shell: bash
      run: |
        chmod +x scripts/test-lambda-functions.sh
        ./scripts/test-lambda-functions.sh -e dev -d
      continue-on-error: true

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, build-frontend]
    if: |
      always() && 
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment: staging
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: build/

    - name: Check for existing certificate (staging)
      id: check-cert-staging
      run: |
        if [ -n "${{ secrets.STAGING_DOMAIN_NAME }}" ]; then
          EXISTING_CERT=$(aws acm list-certificates \
            --query "CertificateSummaryList[?DomainName=='${{ secrets.STAGING_DOMAIN_NAME }}'].CertificateArn" \
            --output text --region us-east-1)
          
          if [ -n "$EXISTING_CERT" ] && [ "$EXISTING_CERT" != "None" ]; then
            echo "certificate_arn=$EXISTING_CERT" >> $GITHUB_OUTPUT
            echo "✅ Found existing certificate: $EXISTING_CERT"
          else
            echo "❌ No existing certificate found"
          fi
        fi

    - name: Deploy with bash script
      shell: bash
      run: |
        chmod +x scripts/deploy.sh
        
        CERTIFICATE_ARN="${{ steps.check-cert-staging.outputs.certificate_arn }}"
        
        if [ -n "${{ secrets.STAGING_DOMAIN_NAME }}" ] && [ -n "$CERTIFICATE_ARN" ]; then
          echo "🚀 Deploying with existing certificate"
          ./scripts/deploy.sh -e staging -d "${{ secrets.STAGING_DOMAIN_NAME }}" -c "$CERTIFICATE_ARN" -z "${{ secrets.HOSTED_ZONE_ID }}" --skip-backend
        elif [ -n "${{ secrets.STAGING_DOMAIN_NAME }}" ]; then
          echo "🚀 Deploying with CDK auto-certificate creation"
          ./scripts/deploy.sh -e staging -d "${{ secrets.STAGING_DOMAIN_NAME }}" -z "${{ secrets.HOSTED_ZONE_ID }}" --skip-backend
        else
          echo "🚀 Deploying without custom domain"
          ./scripts/deploy.sh -e staging --skip-backend
        fi
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    - name: Run integration tests
      run: |
        sleep 30
        if [ -n "${{ secrets.STAGING_DOMAIN_NAME }}" ]; then
          curl -f "https://${{ secrets.STAGING_DOMAIN_NAME }}" || echo "Integration test failed but continuing"
        else
          echo "No domain configured for integration tests"
        fi
      continue-on-error: true

    - name: Test Lambda functions health
      shell: bash
      run: |
        chmod +x scripts/test-lambda-functions.sh
        ./scripts/test-lambda-functions.sh -e staging -d
      continue-on-error: true

  # Deploy to Production
  deploy-prod:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: build/

    - name: Deploy with bash script
      shell: bash
      run: |
        chmod +x scripts/deploy.sh
        ./scripts/deploy.sh -e prod -d "${{ secrets.PROD_DOMAIN_NAME }}" -c "${{ secrets.PROD_CERTIFICATE_ARN }}" -z "${{ secrets.HOSTED_ZONE_ID }}" --skip-backend
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    - name: Run production smoke tests
      run: |
        sleep 30
        if [ -n "${{ secrets.PROD_DOMAIN_NAME }}" ]; then
          curl -f "https://${{ secrets.PROD_DOMAIN_NAME }}" || exit 1
        else
          echo "No domain configured for production tests"
        fi

    - name: Test Lambda functions health
      shell: bash
      run: |
        chmod +x scripts/test-lambda-functions.sh
        ./scripts/test-lambda-functions.sh -e prod -d

    - name: Create GitHub release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          🚀 Production deployment successful!
          
          **Environment:** Production
          **Deployed to:** ${{ secrets.PROD_DOMAIN_NAME || 'CloudFront Distribution' }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref }}
          
          ## Changes
          - Infrastructure deployed with AWS CDK
          - Backend services updated
          - Frontend application deployed
          - All tests passed
        draft: false
        prerelease: false

  # Health Check
  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-prod]
    if: always() && (needs.deploy-dev.result == 'success' || needs.deploy-staging.result == 'success' || needs.deploy-prod.result == 'success')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Wait for deployment
      run: sleep 60

    - name: Health check
      run: |
        echo "🏥 Running health checks..."
        
        # Check dev environment
        if [ -n "${{ secrets.DEV_DOMAIN_NAME }}" ]; then
          echo "Checking dev environment..."
          curl -f "https://${{ secrets.DEV_DOMAIN_NAME }}" && echo "✅ Dev environment healthy" || echo "❌ Dev environment unhealthy"
        fi
        
        # Check staging environment
        if [ -n "${{ secrets.STAGING_DOMAIN_NAME }}" ]; then
          echo "Checking staging environment..."
          curl -f "https://${{ secrets.STAGING_DOMAIN_NAME }}" && echo "✅ Staging environment healthy" || echo "❌ Staging environment unhealthy"
        fi
        
        # Check production environment
        if [ -n "${{ secrets.PROD_DOMAIN_NAME }}" ]; then
          echo "Checking production environment..."
          curl -f "https://${{ secrets.PROD_DOMAIN_NAME }}" && echo "✅ Production environment healthy" || echo "❌ Production environment unhealthy"
        fi
      continue-on-error: true

    - name: Generate build summary
      run: |
        chmod +x scripts/send-build-summary.sh
        
        # Determine which environment was deployed
        DEPLOYED_ENV=""
        DEPLOYED_URL=""
        
        if [ "${{ needs.deploy-dev.result }}" == "success" ]; then
          DEPLOYED_ENV="dev"
          DEPLOYED_URL="${{ secrets.DEV_DOMAIN_NAME }}"
          if [ -z "$DEPLOYED_URL" ]; then
            # Get CloudFront domain as fallback
            DEPLOYED_URL=$(aws cloudformation describe-stacks --stack-name "carbonlens-ai-dev" --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDomainName`].OutputValue' --output text 2>/dev/null || echo "")
            if [ -n "$DEPLOYED_URL" ]; then
              DEPLOYED_URL="https://$DEPLOYED_URL"
            fi
          else
            DEPLOYED_URL="https://$DEPLOYED_URL"
          fi
        elif [ "${{ needs.deploy-staging.result }}" == "success" ]; then
          DEPLOYED_ENV="staging"
          DEPLOYED_URL="https://${{ secrets.STAGING_DOMAIN_NAME }}"
        elif [ "${{ needs.deploy-prod.result }}" == "success" ]; then
          DEPLOYED_ENV="prod"
          DEPLOYED_URL="https://${{ secrets.PROD_DOMAIN_NAME }}"
        fi
        
        if [ -n "$DEPLOYED_ENV" ]; then
          ./scripts/send-build-summary.sh -e "$DEPLOYED_ENV" -s "success" -u "$DEPLOYED_URL"
        fi
      continue-on-error: true

    - name: Upload build summary
      uses: actions/upload-artifact@v4
      with:
        name: build-summary
        path: build-summary-*.json
        retention-days: 30
      if: always()
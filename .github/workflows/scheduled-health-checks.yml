name: Scheduled Health Checks

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: true
        default: 'prod'
        type: choice
        options:
        - dev
        - staging
        - prod

env:
  NODE_VERSION: '18'

jobs:
  # Website health check
  website-health:
    runs-on: ubuntu-latest
    steps:
    - name: Check website availability
      run: |
        DOMAIN="${{ secrets.PROD_DOMAIN_NAME || 'https://carbonlens-ai.solutionsynth.cloud' }}"
        
        echo "🌐 Checking website health: $DOMAIN"
        
        # Check main page
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code},%{time_total}" $DOMAIN)
        HTTP_CODE=$(echo $RESPONSE | cut -d',' -f1)
        RESPONSE_TIME=$(echo $RESPONSE | cut -d',' -f2)
        
        echo "Main page - HTTP: $HTTP_CODE, Time: ${RESPONSE_TIME}s"
        
        if [ $HTTP_CODE -eq 200 ]; then
          echo "✅ Website is healthy"
        else
          echo "❌ Website health check failed with HTTP $HTTP_CODE"
          exit 1
        fi
        
        # Performance check
        if (( $(echo "$RESPONSE_TIME > 5.0" | bc -l) )); then
          echo "⚠️ Slow response time: ${RESPONSE_TIME}s"
        else
          echo "✅ Good response time: ${RESPONSE_TIME}s"
        fi

    - name: Check CloudFront distribution
      run: |
        CLOUDFRONT_URL="${{ secrets.CLOUDFRONT_BACKUP_URL || 'https://d1dqupktcu8kce.cloudfront.net' }}"
        
        echo "☁️ Checking CloudFront: $CLOUDFRONT_URL"
        
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $CLOUDFRONT_URL)
        
        if [ $RESPONSE -eq 200 ]; then
          echo "✅ CloudFront is healthy"
        else
          echo "❌ CloudFront health check failed with HTTP $RESPONSE"
          exit 1
        fi

  # API health check
  api-health:
    runs-on: ubuntu-latest
    steps:
    - name: Check API endpoints
      run: |
        # Get environment from input or default to prod
        ENV="${{ inputs.environment || 'prod' }}"
        
        if [ "$ENV" = "prod" ]; then
          API_BASE="${{ secrets.PROD_API_URL || 'https://t95vjsi3kc.execute-api.us-east-1.amazonaws.com/prod' }}"
        elif [ "$ENV" = "staging" ]; then
          API_BASE="${{ secrets.STAGING_API_URL || 'https://api-staging.solutionsynth.cloud' }}"
        else
          API_BASE="${{ secrets.DEV_API_URL || 'https://zleuzxeorc.execute-api.us-east-1.amazonaws.com/dev' }}"
        fi
        
        echo "🔌 Checking API health: $API_BASE"
        echo "Environment: $ENV"
        
        # Test all API endpoints
        ENDPOINTS=(
          "dashboard:GET"
          "optimizations:GET"
          "process-document:POST"
          "calculate-carbon:POST"
          "certificate:POST"
          "seed-test-data:POST"
          "migrate-user-data:POST"
        )
        
        FAILED_ENDPOINTS=0
        
        for ENDPOINT_INFO in "${ENDPOINTS[@]}"; do
          ENDPOINT=$(echo $ENDPOINT_INFO | cut -d':' -f1)
          METHOD=$(echo $ENDPOINT_INFO | cut -d':' -f2)
          
          echo "Testing $METHOD $API_BASE/$ENDPOINT"
          
          if [ "$METHOD" = "GET" ]; then
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code},%{time_total}" "$API_BASE/$ENDPOINT" --max-time 10)
          else
            # POST with minimal test payload
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code},%{time_total}" \
              -X POST "$API_BASE/$ENDPOINT" \
              -H "Content-Type: application/json" \
              -d '{"test": true}' \
              --max-time 10)
          fi
          
          HTTP_CODE=$(echo $RESPONSE | cut -d',' -f1)
          RESPONSE_TIME=$(echo $RESPONSE | cut -d',' -f2)
          
          # API Gateway returns various codes for unauthenticated requests
          # 200: Success, 400: Bad Request (expected for test data), 401/403: Auth required (expected)
          if [[ "$HTTP_CODE" =~ ^(200|400|401|403)$ ]]; then
            echo "  ✅ $ENDPOINT: HTTP $HTTP_CODE, Time: ${RESPONSE_TIME}s"
            
            # Performance check
            if (( $(echo "$RESPONSE_TIME > 10.0" | bc -l) )); then
              echo "  ⚠️ Slow response time: ${RESPONSE_TIME}s"
            fi
          else
            echo "  ❌ $ENDPOINT: HTTP $HTTP_CODE, Time: ${RESPONSE_TIME}s"
            FAILED_ENDPOINTS=$((FAILED_ENDPOINTS + 1))
          fi
        done
        
        echo ""
        echo "📋 API Endpoints Summary:"
        echo "  Total Endpoints: ${#ENDPOINTS[@]}"
        echo "  Failed Endpoints: $FAILED_ENDPOINTS"
        
        if [ $FAILED_ENDPOINTS -gt 0 ]; then
          echo "❌ Some API endpoints are not responding correctly"
          exit 1
        else
          echo "✅ All API endpoints are responding correctly"
        fi

  # AWS resources health check
  aws-health:
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Check Lambda functions
      run: |
        echo "⚡ Checking Lambda functions..."
        
        # Get environment from input or default to prod
        ENV="${{ inputs.environment || 'prod' }}"
        
        # All 7 Lambda functions in production
        FUNCTIONS=(
          "carbonlens-ai-processDocument-${ENV}"
          "carbonlens-ai-calculateCarbon-${ENV}"
          "carbonlens-ai-getOptimizations-${ENV}"
          "carbonlens-ai-generateCertificate-${ENV}"
          "carbonlens-ai-getDashboardData-${ENV}"
          "carbonlens-ai-seedTestData-${ENV}"
          "carbonlens-ai-migrateUserData-${ENV}"
        )
        
        FAILED_FUNCTIONS=0
        
        for FUNCTION in "${FUNCTIONS[@]}"; do
          echo "Checking $FUNCTION..."
          
          # Check function status
          STATUS=$(aws lambda get-function --function-name $FUNCTION --query 'Configuration.State' --output text 2>/dev/null || echo "NotFound")
          
          if [ "$STATUS" = "Active" ]; then
            echo "✅ $FUNCTION: Active"
            
            # Get function metrics (invocations, errors, duration)
            INVOCATIONS=$(aws cloudwatch get-metric-statistics \
              --namespace AWS/Lambda \
              --metric-name Invocations \
              --dimensions Name=FunctionName,Value=$FUNCTION \
              --statistics Sum \
              --start-time $(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S) \
              --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
              --period 3600 \
              --query 'Datapoints[0].Sum' --output text 2>/dev/null || echo "0")
            
            ERRORS=$(aws cloudwatch get-metric-statistics \
              --namespace AWS/Lambda \
              --metric-name Errors \
              --dimensions Name=FunctionName,Value=$FUNCTION \
              --statistics Sum \
              --start-time $(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S) \
              --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
              --period 3600 \
              --query 'Datapoints[0].Sum' --output text 2>/dev/null || echo "0")
            
            AVG_DURATION=$(aws cloudwatch get-metric-statistics \
              --namespace AWS/Lambda \
              --metric-name Duration \
              --dimensions Name=FunctionName,Value=$FUNCTION \
              --statistics Average \
              --start-time $(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S) \
              --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
              --period 3600 \
              --query 'Datapoints[0].Average' --output text 2>/dev/null || echo "0")
            
            echo "  📊 Invocations: ${INVOCATIONS}, Errors: ${ERRORS}, Avg Duration: ${AVG_DURATION}ms"
            
            # Check if error rate is concerning
            if [ "$INVOCATIONS" != "0" ] && [ "$INVOCATIONS" != "None" ]; then
              ERROR_RATE=$(echo "scale=2; $ERRORS * 100 / $INVOCATIONS" | bc -l 2>/dev/null || echo "0")
              if (( $(echo "$ERROR_RATE > 5" | bc -l) )); then
                echo "  ⚠️ High error rate: ${ERROR_RATE}%"
              fi
            fi
            
          else
            echo "❌ $FUNCTION: $STATUS"
            FAILED_FUNCTIONS=$((FAILED_FUNCTIONS + 1))
          fi
          echo ""
        done
        
        echo "📋 Lambda Functions Summary:"
        echo "  Total Functions: ${#FUNCTIONS[@]}"
        echo "  Failed Functions: $FAILED_FUNCTIONS"
        
        if [ $FAILED_FUNCTIONS -gt 0 ]; then
          echo "❌ Some Lambda functions are not healthy"
          exit 1
        else
          echo "✅ All Lambda functions are healthy"
        fi

    - name: Check DynamoDB table
      run: |
        echo "🗄️ Checking DynamoDB table..."
        
        # Get environment from input or default to prod
        ENV="${{ inputs.environment || 'prod' }}"
        TABLE_NAME="carbonlens-ai-data-${ENV}"
        
        echo "Checking table: $TABLE_NAME"
        
        TABLE_STATUS=$(aws dynamodb describe-table --table-name $TABLE_NAME --query 'Table.TableStatus' --output text 2>/dev/null || echo "NotFound")
        
        if [ "$TABLE_STATUS" = "ACTIVE" ]; then
          echo "✅ DynamoDB table: Active"
          
          # Check item count
          ITEM_COUNT=$(aws dynamodb scan --table-name $TABLE_NAME --select COUNT --query 'Count' --output text)
          echo "📊 Item count: $ITEM_COUNT"
          
          # Check table metrics
          READ_CAPACITY=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/DynamoDB \
            --metric-name ConsumedReadCapacityUnits \
            --dimensions Name=TableName,Value=$TABLE_NAME \
            --statistics Sum \
            --start-time $(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S) \
            --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
            --period 3600 \
            --query 'Datapoints[0].Sum' --output text 2>/dev/null || echo "0")
          
          WRITE_CAPACITY=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/DynamoDB \
            --metric-name ConsumedWriteCapacityUnits \
            --dimensions Name=TableName,Value=$TABLE_NAME \
            --statistics Sum \
            --start-time $(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S) \
            --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
            --period 3600 \
            --query 'Datapoints[0].Sum' --output text 2>/dev/null || echo "0")
          
          echo "📈 Read Capacity Used (1h): $READ_CAPACITY"
          echo "📈 Write Capacity Used (1h): $WRITE_CAPACITY"
          
        else
          echo "❌ DynamoDB table: $TABLE_STATUS"
          exit 1
        fi

    - name: Check S3 buckets
      run: |
        echo "🪣 Checking S3 buckets..."
        
        # Get environment from input or default to prod
        ENV="${{ inputs.environment || 'prod' }}"
        AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID || '790756194179' }}"
        
        BUCKETS=(
          "carbonlens-ai-web-${ENV}-${AWS_ACCOUNT_ID}"
          "carbonlens-ai-docs-${ENV}-${AWS_ACCOUNT_ID}"
        )
        
        FAILED_BUCKETS=0
        
        for BUCKET in "${BUCKETS[@]}"; do
          echo "Checking bucket: $BUCKET"
          
          if aws s3 ls s3://$BUCKET >/dev/null 2>&1; then
            echo "✅ $BUCKET: Accessible"
            
            # Check object count
            OBJECT_COUNT=$(aws s3 ls s3://$BUCKET --recursive | wc -l)
            echo "  📁 Objects: $OBJECT_COUNT"
            
            # Check bucket size
            BUCKET_SIZE=$(aws s3 ls s3://$BUCKET --recursive --human-readable --summarize | grep "Total Size" | awk '{print $3, $4}' || echo "Unknown")
            echo "  📏 Size: $BUCKET_SIZE"
            
            # Check if frontend bucket has required files
            if [[ "$BUCKET" == *"web"* ]]; then
              if aws s3 ls s3://$BUCKET/index.html >/dev/null 2>&1; then
                echo "  ✅ index.html found"
              else
                echo "  ❌ index.html missing"
                FAILED_BUCKETS=$((FAILED_BUCKETS + 1))
              fi
            fi
            
          else
            echo "❌ $BUCKET: Not accessible"
            FAILED_BUCKETS=$((FAILED_BUCKETS + 1))
          fi
          echo ""
        done
        
        echo "📋 S3 Buckets Summary:"
        echo "  Total Buckets: ${#BUCKETS[@]}"
        echo "  Failed Buckets: $FAILED_BUCKETS"
        
        if [ $FAILED_BUCKETS -gt 0 ]; then
          echo "❌ Some S3 buckets are not accessible"
          exit 1
        else
          echo "✅ All S3 buckets are accessible"
        fi

    - name: Check CloudFront distribution
      run: |
        echo "☁️ Checking CloudFront distribution..."
        
        DISTRIBUTION_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || 'E2P398QOXMEM5S' }}"
        
        STATUS=$(aws cloudfront get-distribution --id $DISTRIBUTION_ID --query 'Distribution.Status' --output text 2>/dev/null || echo "NotFound")
        
        if [ "$STATUS" = "Deployed" ]; then
          echo "✅ CloudFront distribution: Deployed"
        else
          echo "❌ CloudFront distribution: $STATUS"
        fi

    - name: Check Cognito User Pool
      run: |
        echo "🔐 Checking Cognito User Pool..."
        
        USER_POOL_ID="${{ secrets.COGNITO_USER_POOL_ID || 'us-east-1_pesPWWfoF' }}"
        
        STATUS=$(aws cognito-idp describe-user-pool --user-pool-id $USER_POOL_ID --query 'UserPool.Status' --output text 2>/dev/null || echo "NotFound")
        
        if [ "$STATUS" = "ACTIVE" ] || [ "$STATUS" = "Enabled" ]; then
          echo "✅ Cognito User Pool: Active"
          
          # Check user count
          USER_COUNT=$(aws cognito-idp list-users --user-pool-id $USER_POOL_ID --query 'length(Users)' --output text)
          echo "👥 User count: $USER_COUNT"
        else
          echo "❌ Cognito User Pool: $STATUS"
        fi

  # Performance monitoring
  performance-check:
    runs-on: ubuntu-latest
    steps:
    - name: Install performance testing tools
      run: |
        npm install -g lighthouse
        sudo apt-get update
        sudo apt-get install -y bc

    - name: Run Lighthouse audit
      run: |
        DOMAIN="${{ secrets.PROD_DOMAIN_NAME || 'https://carbonlens-ai.solutionsynth.cloud' }}"
        
        echo "🔍 Running Lighthouse audit on $DOMAIN"
        
        lighthouse $DOMAIN --output json --output-path lighthouse-results.json --chrome-flags="--headless --no-sandbox" || true
        
        if [ -f lighthouse-results.json ]; then
          PERFORMANCE=$(cat lighthouse-results.json | jq '.lhr.categories.performance.score * 100' | cut -d'.' -f1)
          ACCESSIBILITY=$(cat lighthouse-results.json | jq '.lhr.categories.accessibility.score * 100' | cut -d'.' -f1)
          BEST_PRACTICES=$(cat lighthouse-results.json | jq '.lhr.categories["best-practices"].score * 100' | cut -d'.' -f1)
          SEO=$(cat lighthouse-results.json | jq '.lhr.categories.seo.score * 100' | cut -d'.' -f1)
          
          echo "📊 Lighthouse Scores:"
          echo "  Performance: ${PERFORMANCE}%"
          echo "  Accessibility: ${ACCESSIBILITY}%"
          echo "  Best Practices: ${BEST_PRACTICES}%"
          echo "  SEO: ${SEO}%"
          
          # Alert if performance is below 80%
          if [ $PERFORMANCE -lt 80 ]; then
            echo "⚠️ Performance score below 80%"
          fi
        else
          echo "❌ Lighthouse audit failed"
        fi

    - name: Upload Lighthouse results
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-results
        path: lighthouse-results.json
        retention-days: 30
      if: always()

  # Generate health report
  health-report:
    runs-on: ubuntu-latest
    needs: [website-health, api-health, aws-health, performance-check]
    if: always()
    steps:
    - name: Create health summary
      run: |
        echo "# CarbonLens AI - Health Check Report" > health-report.md
        echo "" >> health-report.md
        echo "**Check Date:** $(date)" >> health-report.md
        echo "**Environment:** ${{ inputs.environment || 'prod' }}" >> health-report.md
        echo "" >> health-report.md
        
        echo "## 🌐 Website Health" >> health-report.md
        if [ "${{ needs.website-health.result }}" = "success" ]; then
          echo "✅ Website is healthy and responsive" >> health-report.md
        else
          echo "❌ Website health check failed" >> health-report.md
        fi
        echo "" >> health-report.md
        
        echo "## 🔌 API Health" >> health-report.md
        if [ "${{ needs.api-health.result }}" = "success" ]; then
          echo "✅ API endpoints are responding correctly" >> health-report.md
        else
          echo "❌ API health check failed" >> health-report.md
        fi
        echo "" >> health-report.md
        
        echo "## ☁️ AWS Resources" >> health-report.md
        if [ "${{ needs.aws-health.result }}" = "success" ]; then
          echo "✅ All AWS resources are healthy" >> health-report.md
        else
          echo "❌ Some AWS resources may have issues" >> health-report.md
        fi
        echo "" >> health-report.md
        
        echo "## 📊 Performance" >> health-report.md
        if [ "${{ needs.performance-check.result }}" = "success" ]; then
          echo "✅ Performance metrics collected successfully" >> health-report.md
        else
          echo "⚠️ Performance check encountered issues" >> health-report.md
        fi
        echo "" >> health-report.md
        
        echo "## 📋 Summary" >> health-report.md
        FAILED_JOBS=0
        
        if [ "${{ needs.website-health.result }}" != "success" ]; then
          FAILED_JOBS=$((FAILED_JOBS + 1))
        fi
        if [ "${{ needs.api-health.result }}" != "success" ]; then
          FAILED_JOBS=$((FAILED_JOBS + 1))
        fi
        if [ "${{ needs.aws-health.result }}" != "success" ]; then
          FAILED_JOBS=$((FAILED_JOBS + 1))
        fi
        
        if [ $FAILED_JOBS -eq 0 ]; then
          echo "🎉 All health checks passed!" >> health-report.md
        else
          echo "⚠️ $FAILED_JOBS health check(s) failed. Please investigate." >> health-report.md
        fi
        
        echo "" >> health-report.md
        echo "## 🔗 Quick Links" >> health-report.md
        echo "- [Website](${{ secrets.PROD_DOMAIN_NAME || 'https://carbonlens-ai.solutionsynth.cloud' }})" >> health-report.md
        echo "- [CloudFront](${{ secrets.CLOUDFRONT_BACKUP_URL || 'https://d1dqupktcu8kce.cloudfront.net' }})" >> health-report.md
        echo "- [API](${{ secrets.API_BASE_URL || 'https://2fi7ahgujj.execute-api.us-east-1.amazonaws.com/dev' }})" >> health-report.md

    - name: Upload health report
      uses: actions/upload-artifact@v4
      with:
        name: health-report
        path: health-report.md
        retention-days: 90

    - name: Notify on failure
      if: failure()
      run: |
        echo "🚨 Health check failed! Please check the logs and investigate."
        echo "Failed jobs:"
        echo "- Website Health: ${{ needs.website-health.result }}"
        echo "- API Health: ${{ needs.api-health.result }}"
        echo "- AWS Health: ${{ needs.aws-health.result }}"
        echo "- Performance Check: ${{ needs.performance-check.result }}"
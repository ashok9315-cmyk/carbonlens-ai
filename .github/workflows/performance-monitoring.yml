name: Performance Monitoring

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'prod'
        type: choice
        options:
        - dev
        - staging
        - prod

env:
  NODE_VERSION: '18'

jobs:
  # Lighthouse performance audit
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Lighthouse CI
      run: npm install -g @lhci/cli@0.12.x

    - name: Run Lighthouse CI
      run: |
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        LHCI_BUILD_CONTEXT__COMMIT_TIME: ${{ github.event.head_commit.timestamp }}

    - name: Upload Lighthouse results
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-results
        path: .lighthouseci/
        retention-days: 30

  # API performance testing
  api-performance:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Run API performance tests
      run: |
        k6 run --out json=api-performance-results.json tests/performance/api-load-test.js || true
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://2fi7ahgujj.execute-api.us-east-1.amazonaws.com/dev' }}

    - name: Upload API performance results
      uses: actions/upload-artifact@v4
      with:
        name: api-performance-results
        path: api-performance-results.json
        retention-days: 30

  # Bundle size analysis
  bundle-analysis:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Analyze bundle size
      run: |
        npx webpack-bundle-analyzer build/static/js/*.js --report --mode static --report-filename bundle-report.html

    - name: Upload bundle analysis
      uses: actions/upload-artifact@v4
      with:
        name: bundle-analysis
        path: bundle-report.html
        retention-days: 30

  # AWS resource monitoring
  aws-monitoring:
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Check Lambda performance
      run: |
        # Get Lambda function metrics
        aws cloudwatch get-metric-statistics \
          --namespace AWS/Lambda \
          --metric-name Duration \
          --dimensions Name=FunctionName,Value=carbonlensaibackend-dev-processDocument \
          --statistics Average,Maximum \
          --start-time $(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S) \
          --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
          --period 300 > lambda-metrics.json || true

    - name: Check DynamoDB performance
      run: |
        # Get DynamoDB metrics
        aws cloudwatch get-metric-statistics \
          --namespace AWS/DynamoDB \
          --metric-name ConsumedReadCapacityUnits \
          --dimensions Name=TableName,Value=carbonlens-ai-data-dev \
          --statistics Sum \
          --start-time $(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S) \
          --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
          --period 300 > dynamodb-metrics.json || true

    - name: Check S3 performance
      run: |
        # Get S3 metrics
        aws cloudwatch get-metric-statistics \
          --namespace AWS/S3 \
          --metric-name NumberOfObjects \
          --dimensions Name=BucketName,Value=carbonlens-ai-docs-dev-790756194179 Name=StorageType,Value=AllStorageTypes \
          --statistics Average \
          --start-time $(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%S) \
          --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
          --period 86400 > s3-metrics.json || true

    - name: Upload AWS metrics
      uses: actions/upload-artifact@v4
      with:
        name: aws-metrics
        path: |
          lambda-metrics.json
          dynamodb-metrics.json
          s3-metrics.json
        retention-days: 30

  # Performance report
  performance-report:
    runs-on: ubuntu-latest
    needs: [lighthouse-audit, api-performance, bundle-analysis, aws-monitoring]
    if: always()
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create performance summary
      run: |
        echo "# Performance Monitoring Report" > performance-summary.md
        echo "" >> performance-summary.md
        echo "**Report Date:** $(date)" >> performance-summary.md
        echo "**Repository:** ${{ github.repository }}" >> performance-summary.md
        echo "**Environment:** ${{ inputs.environment || 'prod' }}" >> performance-summary.md
        echo "" >> performance-summary.md
        
        echo "## Performance Metrics" >> performance-summary.md
        echo "- ✅ Lighthouse Audit: Completed" >> performance-summary.md
        echo "- ✅ API Performance: Completed" >> performance-summary.md
        echo "- ✅ Bundle Analysis: Completed" >> performance-summary.md
        echo "- ✅ AWS Monitoring: Completed" >> performance-summary.md
        echo "" >> performance-summary.md
        
        echo "## Key Findings" >> performance-summary.md
        echo "- Frontend performance metrics available in Lighthouse results" >> performance-summary.md
        echo "- API response times measured and recorded" >> performance-summary.md
        echo "- Bundle size analysis completed" >> performance-summary.md
        echo "- AWS resource utilization monitored" >> performance-summary.md
        echo "" >> performance-summary.md
        
        echo "## Recommendations" >> performance-summary.md
        echo "1. Review Lighthouse audit for optimization opportunities" >> performance-summary.md
        echo "2. Monitor API response times for performance degradation" >> performance-summary.md
        echo "3. Optimize bundle size if it exceeds thresholds" >> performance-summary.md
        echo "4. Scale AWS resources based on utilization metrics" >> performance-summary.md

    - name: Upload performance summary
      uses: actions/upload-artifact@v4
      with:
        name: performance-summary
        path: performance-summary.md
        retention-days: 90
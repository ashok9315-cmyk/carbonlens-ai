name: Dependency Updates

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday at 9 AM UTC
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # Check for outdated dependencies
  dependency-check:
    runs-on: ubuntu-latest
    outputs:
      has-updates: ${{ steps.check-updates.outputs.has-updates }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd backend && npm ci

    - name: Check for outdated packages
      id: check-updates
      run: |
        # Frontend dependencies
        npm outdated --json > frontend-outdated.json || true
        cd backend && npm outdated --json > ../backend-outdated.json || true
        cd ..
        
        # Check if there are any updates
        if [ -s frontend-outdated.json ] || [ -s backend-outdated.json ]; then
          echo "has-updates=true" >> $GITHUB_OUTPUT
        else
          echo "has-updates=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload dependency reports
      uses: actions/upload-artifact@v4
      with:
        name: dependency-reports
        path: |
          frontend-outdated.json
          backend-outdated.json
        retention-days: 30

  # Security audit
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd backend && npm ci

    - name: Run security audit
      run: |
        npm audit --json > frontend-audit.json || true
        cd backend && npm audit --json > ../backend-audit.json || true

    - name: Check for high/critical vulnerabilities
      run: |
        # Check frontend
        HIGH_VULNS=$(cat frontend-audit.json | jq '.metadata.vulnerabilities.high // 0')
        CRITICAL_VULNS=$(cat frontend-audit.json | jq '.metadata.vulnerabilities.critical // 0')
        
        # Check backend
        BACKEND_HIGH=$(cat backend-audit.json | jq '.metadata.vulnerabilities.high // 0')
        BACKEND_CRITICAL=$(cat backend-audit.json | jq '.metadata.vulnerabilities.critical // 0')
        
        echo "Frontend - High: $HIGH_VULNS, Critical: $CRITICAL_VULNS"
        echo "Backend - High: $BACKEND_HIGH, Critical: $BACKEND_CRITICAL"
        
        TOTAL_HIGH=$((HIGH_VULNS + BACKEND_HIGH))
        TOTAL_CRITICAL=$((CRITICAL_VULNS + BACKEND_CRITICAL))
        
        if [ $TOTAL_CRITICAL -gt 0 ]; then
          echo "❌ Critical vulnerabilities found: $TOTAL_CRITICAL"
          exit 1
        elif [ $TOTAL_HIGH -gt 0 ]; then
          echo "⚠️ High vulnerabilities found: $TOTAL_HIGH"
        else
          echo "✅ No high or critical vulnerabilities found"
        fi

    - name: Upload security audit results
      uses: actions/upload-artifact@v4
      with:
        name: security-audit-results
        path: |
          frontend-audit.json
          backend-audit.json
        retention-days: 30

  # Create update PR
  create-update-pr:
    runs-on: ubuntu-latest
    needs: [dependency-check, security-audit]
    if: needs.dependency-check.outputs.has-updates == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Create update branch
      run: |
        BRANCH_NAME="chore/dependency-updates-$(date +%Y%m%d)"
        git checkout -b $BRANCH_NAME
        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

    - name: Update frontend dependencies
      run: |
        npm update
        npm audit fix --audit-level moderate || true

    - name: Update backend dependencies
      run: |
        cd backend
        npm update
        npm audit fix --audit-level moderate || true

    - name: Check for changes
      id: check-changes
      run: |
        if git diff --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      if: steps.check-changes.outputs.changes == 'true'
      run: |
        git add .
        git commit -m "chore: update dependencies and fix security vulnerabilities

        - Updated npm dependencies to latest versions
        - Fixed security vulnerabilities where possible
        - Automated update via GitHub Actions"

    - name: Push changes
      if: steps.check-changes.outputs.changes == 'true'
      run: git push origin $BRANCH_NAME

    - name: Download dependency reports
      if: steps.check-changes.outputs.changes == 'true'
      uses: actions/download-artifact@v4
      with:
        name: dependency-reports

    - name: Download security audit results
      if: steps.check-changes.outputs.changes == 'true'
      uses: actions/download-artifact@v4
      with:
        name: security-audit-results

    - name: Create Pull Request
      if: steps.check-changes.outputs.changes == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Read audit results
          let frontendAudit = {};
          let backendAudit = {};
          
          try {
            frontendAudit = JSON.parse(fs.readFileSync('frontend-audit.json', 'utf8'));
          } catch (e) {
            console.log('No frontend audit results');
          }
          
          try {
            backendAudit = JSON.parse(fs.readFileSync('backend-audit.json', 'utf8'));
          } catch (e) {
            console.log('No backend audit results');
          }
          
          const frontendVulns = frontendAudit.metadata?.vulnerabilities || {};
          const backendVulns = backendAudit.metadata?.vulnerabilities || {};
          
          const body = `## 🔄 Automated Dependency Updates

          This PR contains automated dependency updates and security fixes.

          ### 📊 Security Audit Results

          **Frontend:**
          - Critical: ${frontendVulns.critical || 0}
          - High: ${frontendVulns.high || 0}
          - Moderate: ${frontendVulns.moderate || 0}
          - Low: ${frontendVulns.low || 0}

          **Backend:**
          - Critical: ${backendVulns.critical || 0}
          - High: ${backendVulns.high || 0}
          - Moderate: ${backendVulns.moderate || 0}
          - Low: ${backendVulns.low || 0}

          ### ✅ What's Updated

          - Updated npm dependencies to latest compatible versions
          - Applied security fixes where available
          - Maintained compatibility with existing code

          ### 🧪 Testing

          - [ ] All automated tests pass
          - [ ] Manual testing completed
          - [ ] No breaking changes introduced

          ### 📝 Notes

          - This PR was automatically created by GitHub Actions
          - Review the changes carefully before merging
          - Test the application thoroughly after merging

          ---
          *Generated on ${new Date().toISOString()}*`;

          const { data: pr } = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🔄 chore: automated dependency updates',
            head: process.env.BRANCH_NAME,
            base: 'main',
            body: body
          });

          console.log(`Created PR #${pr.number}: ${pr.html_url}`);

  # Generate dependency report
  generate-report:
    runs-on: ubuntu-latest
    needs: [dependency-check, security-audit]
    if: always()
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Generate comprehensive report
      run: |
        echo "# CarbonLens AI - Dependency & Security Report" > dependency-security-report.md
        echo "" >> dependency-security-report.md
        echo "**Generated:** $(date)" >> dependency-security-report.md
        echo "**Repository:** ${{ github.repository }}" >> dependency-security-report.md
        echo "" >> dependency-security-report.md
        
        echo "## 📦 Dependency Status" >> dependency-security-report.md
        
        if [ -f dependency-reports/frontend-outdated.json ]; then
          echo "### Frontend Dependencies" >> dependency-security-report.md
          if [ -s dependency-reports/frontend-outdated.json ]; then
            echo "⚠️ Outdated packages found" >> dependency-security-report.md
          else
            echo "✅ All packages up to date" >> dependency-security-report.md
          fi
        fi
        
        if [ -f dependency-reports/backend-outdated.json ]; then
          echo "### Backend Dependencies" >> dependency-security-report.md
          if [ -s dependency-reports/backend-outdated.json ]; then
            echo "⚠️ Outdated packages found" >> dependency-security-report.md
          else
            echo "✅ All packages up to date" >> dependency-security-report.md
          fi
        fi
        
        echo "" >> dependency-security-report.md
        echo "## 🔒 Security Status" >> dependency-security-report.md
        
        if [ -f security-audit-results/frontend-audit.json ]; then
          echo "### Frontend Security" >> dependency-security-report.md
          CRITICAL=$(cat security-audit-results/frontend-audit.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat security-audit-results/frontend-audit.json | jq '.metadata.vulnerabilities.high // 0')
          
          if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
            echo "❌ Vulnerabilities found - Critical: $CRITICAL, High: $HIGH" >> dependency-security-report.md
          else
            echo "✅ No critical or high vulnerabilities" >> dependency-security-report.md
          fi
        fi
        
        if [ -f security-audit-results/backend-audit.json ]; then
          echo "### Backend Security" >> dependency-security-report.md
          CRITICAL=$(cat security-audit-results/backend-audit.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat security-audit-results/backend-audit.json | jq '.metadata.vulnerabilities.high // 0')
          
          if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
            echo "❌ Vulnerabilities found - Critical: $CRITICAL, High: $HIGH" >> dependency-security-report.md
          else
            echo "✅ No critical or high vulnerabilities" >> dependency-security-report.md
          fi
        fi
        
        echo "" >> dependency-security-report.md
        echo "## 📋 Recommendations" >> dependency-security-report.md
        echo "1. Review and merge any dependency update PRs" >> dependency-security-report.md
        echo "2. Address critical and high security vulnerabilities immediately" >> dependency-security-report.md
        echo "3. Test thoroughly after updating dependencies" >> dependency-security-report.md
        echo "4. Monitor for new security advisories" >> dependency-security-report.md

    - name: Upload comprehensive report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-security-report
        path: dependency-security-report.md
        retention-days: 90